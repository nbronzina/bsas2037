<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red de Aguante - Buenos Aires 2037</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: 'Courier New', monospace;
            color: #cccccc;
            cursor: pointer;
        }

        #welcome-title {
            font-size: 64px;
            color: #d4a574;
            margin-bottom: 20px;
            letter-spacing: 6px;
            font-weight: bold;
        }

        #welcome-subtitle {
            font-size: 20px;
            color: #888;
            margin-bottom: 80px;
        }

        #welcome-action {
            font-size: 26px;
            color: #d4a574;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
            font-weight: bold;
        }

        #welcome-hint {
            font-size: 14px;
            color: #666;
            margin-bottom: 100px;
        }

        #welcome-credits {
            position: absolute;
            bottom: 50px;
            text-align: center;
            font-size: 13px;
            color: #555;
            line-height: 1.9;
        }
    </style>
</head>
<body>
    <!-- Pantalla de bienvenida -->
    <div id="welcome-overlay">
        <div id="welcome-title">RED DE AGUANTE</div>
        <div id="welcome-subtitle">Prototipo de investigación</div>

        <div id="welcome-action">[ CLICK PARA COMENZAR ]</div>
        <div id="welcome-hint">o presiona cualquier tecla</div>

        <div id="welcome-credits">
            LAB de Mundanidad Forzada<br>
            en colaboración con<br>
            Heated Studio
        </div>
    </div>

    <div id="game-container"></div>

    <!-- Managers -->
    <script src="src/managers/ResourceManager.js"></script>
    <script src="src/managers/TimeManager.js"></script>
    <script src="src/managers/SaveManager.js"></script>
    <script src="src/managers/AudioManager.js"></script>

    <!-- Utils -->
    <script src="src/utils/Constants.js"></script>
    <script src="src/utils/Helpers.js"></script>

    <!-- Scenes -->
    <script src="src/scenes/MainMenuScene.js"></script>
    <script src="src/scenes/IntroScene.js"></script>
    <script src="src/scenes/InfoScene.js"></script>
    <script src="src/scenes/MapScene.js"></script>
    <script src="src/scenes/EncounterScene.js"></script>
    <script src="src/scenes/ManagementScene.js"></script>
    <script src="src/scenes/EndGameScene.js"></script>

    <!-- Main entry point -->
    <script src="src/main.js"></script>
</body>
</html>
